name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-jdk17-semgrep:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.10.4"
          enable-cache: false

      - name: Assemble native Linux Semgrep pack
        run: ./scripts/build-semgrep-pack.sh linux-x86_64

      - name: Verify all modules and real Semgrep API flow
        run: >-
          ./mvnw -B clean verify
          -Daudit.semgrep.executable="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/semgrep/semgrep/bin/semgrep"
          -Daudit.semgrep.rules="$GITHUB_WORKSPACE/config/rules/semgrep/java-audit.yaml"
