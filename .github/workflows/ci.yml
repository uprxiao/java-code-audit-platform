name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux-jdk17-semgrep:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.10.4"

      - name: Assemble native Linux Semgrep pack
        run: ./scripts/build-semgrep-pack.sh linux-x86_64

      - name: Verify all modules and real Semgrep API flow
        run: >-
          ./mvnw -B clean verify
          -Daudit.semgrep.executable="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/semgrep/semgrep/bin/semgrep"
          -Daudit.semgrep.rules="$GITHUB_WORKSPACE/config/rules/semgrep/java-audit.yaml"
