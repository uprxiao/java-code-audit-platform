name: Deep Release Acceptance

on:
  workflow_dispatch:
    inputs:
      accept_codeql_terms:
        description: "I reviewed the current GitHub CodeQL Terms for this open-source repository"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-jdk17-deep:
    if: inputs.accept_codeql_terms == true
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: "0.10.4"
          enable-cache: false

      - name: Resolve the pinned Maven 3.9 executable
        shell: bash
        run: |
          ./mvnw -B -q -version
          MAVEN_EXECUTABLE="$(find "$HOME/.m2/wrapper/dists/apache-maven-3.9.12" \
            -type f -path '*/bin/mvn' -print -quit)"
          test -x "$MAVEN_EXECUTABLE"
          echo "AUDIT_MAVEN_EXECUTABLE=$MAVEN_EXECUTABLE" >> "$GITHUB_ENV"
          echo "$(dirname "$MAVEN_EXECUTABLE")" >> "$GITHUB_PATH"

      - name: Assemble all redistributable Linux tools
        run: |
          ./scripts/build-semgrep-pack.sh linux-x86_64
          ./scripts/build-quick-tool-pack.sh linux-x86_64
          ./scripts/run-quick-tools-smoke.sh "$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/quick"
          ./scripts/run-standard-analysis-smoke.sh
          ./scripts/build-standard-supply-tool-pack.sh linux-x86_64

      - name: Build acceptance-only Dependency-Check data
        env:
          AUDIT_ACCEPT_INCOMPLETE_SMOKE_DATA: "YES"
          AUDIT_DEPENDENCY_CHECK_EXECUTABLE: ${{ github.workspace }}/tools/downloads/tool-pack/linux-x86_64/standard-supply/dependency-check/dependency-check/bin/dependency-check.sh
          AUDIT_DEPENDENCY_CHECK_SMOKE_DATA: ${{ github.workspace }}/tools/downloads/databases/dependency-check-smoke
        run: ./scripts/build-dependency-check-smoke-data.sh

      - name: Download both Trivy vulnerability databases
        shell: bash
        run: |
          TRIVY="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/quick/trivy/bin/trivy"
          CACHE="$GITHUB_WORKSPACE/tools/downloads/databases/trivy"
          mkdir -p "$CACHE"
          "$TRIVY" image --cache-dir "$CACHE" --no-progress --download-db-only
          "$TRIVY" image --cache-dir "$CACHE" --no-progress --download-java-db-only
          test -s "$CACHE/db/trivy.db"
          test -s "$CACHE/java-db/trivy-java.db"

      - name: Install controlled local CodeQL and locked Java queries
        run: ./scripts/install-codeql-local.sh

      - name: Run real CodeQL Deep adapter smoke
        env:
          AUDIT_CODEQL_EXECUTABLE: ${{ github.workspace }}/tools/local/codeql-v2.26.2/codeql/codeql
          AUDIT_CODEQL_QUERY_SUITE: ${{ github.workspace }}/tools/local/codeql-packs/codeql/java-queries/1.11.7/codeql-suites/java-security-and-quality.qls
        run: ./scripts/run-codeql-deep-smoke.sh

      - name: Verify all modules with every real Linux profile
        run: >-
          ./mvnw -B clean verify
          -Daudit.maven.executable="$AUDIT_MAVEN_EXECUTABLE"
          -Daudit.quick.root="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/quick"
          -Daudit.semgrep.executable="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/semgrep/semgrep/bin/semgrep"
          -Daudit.semgrep.rules="$GITHUB_WORKSPACE/config/rules/semgrep/java-audit.yaml"
          -Daudit.spotbugs.home="$GITHUB_WORKSPACE/tools/downloads/tool-pack/common/standard-analysis/spotbugs"
          -Daudit.findsecbugs.plugin="$GITHUB_WORKSPACE/tools/downloads/tool-pack/common/standard-analysis/findsecbugs/lib/findsecbugs-plugin-1.14.0.jar"
          -Daudit.spotbugs.exclude="$GITHUB_WORKSPACE/config/rules/spotbugs-exclude.xml"
          -Daudit.standard.maven="$AUDIT_MAVEN_EXECUTABLE"
          -Daudit.osv.executable="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/standard-supply/osv-scanner/bin/osv-scanner"
          -Daudit.dependency-check.executable="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/standard-supply/dependency-check/dependency-check/bin/dependency-check.sh"
          -Daudit.dependency-check.data="$GITHUB_WORKSPACE/tools/downloads/databases/dependency-check-smoke"
          -Daudit.trivy.executable="$GITHUB_WORKSPACE/tools/downloads/tool-pack/linux-x86_64/quick/trivy/bin/trivy"
          -Daudit.trivy.cache="$GITHUB_WORKSPACE/tools/downloads/databases/trivy"
          -Daudit.codeql.executable="$GITHUB_WORKSPACE/tools/local/codeql-v2.26.2/codeql/codeql"
          -Daudit.codeql.querySuite="$GITHUB_WORKSPACE/tools/local/codeql-packs/codeql/java-queries/1.11.7/codeql-suites/java-security-and-quality.qls"

      - name: Assemble and run the Linux Deep release
        shell: bash
        env:
          AUDIT_MINIMUM_FREE_BYTES: "1"
          AUDIT_CODEQL_ENABLED: "true"
          AUDIT_CODEQL_TERMS_ACCEPTED: "true"
        run: |
          set -euo pipefail
          ./scripts/build-distribution.sh linux-x86_64 0.1.0-deep-ci
          ARCHIVE="$GITHUB_WORKSPACE/dist/java-code-audit-platform-0.1.0-deep-ci-linux-x86_64.zip"
          RUNTIME_ROOT="$(mktemp -d "$RUNNER_TEMP/java-audit-deep.XXXXXX")"
          unzip -q "$ARCHIVE" -d "$RUNTIME_ROOT"
          BUNDLE="$RUNTIME_ROOT/java-code-audit-platform-0.1.0-deep-ci-linux-x86_64"
          mkdir -p "$BUNDLE/data/databases"
          cp -R "$GITHUB_WORKSPACE/tools/downloads/databases/dependency-check-smoke" \
            "$BUNDLE/data/databases/dependency-check"
          ln -s "$GITHUB_WORKSPACE/tools/downloads/databases/trivy" "$BUNDLE/data/databases/trivy"
          export AUDIT_PORT=18080
          export AUDIT_MAVEN_EXECUTABLE
          export AUDIT_CODEQL_EXECUTABLE="$GITHUB_WORKSPACE/tools/local/codeql-v2.26.2/codeql/codeql"
          export AUDIT_CODEQL_QUERY_SUITE="$GITHUB_WORKSPACE/tools/local/codeql-packs/codeql/java-queries/1.11.7/codeql-suites/java-security-and-quality.qls"
          export AUDIT_ACCEPTANCE_EVIDENCE_DIR="$RUNNER_TEMP/v1-acceptance-evidence/linux-deep"
          "$BUNDLE/bin/run.sh" >"$RUNNER_TEMP/java-audit-deep.log" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for _attempt in {1..240}; do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              sed -n '1,260p' "$RUNNER_TEMP/java-audit-deep.log" >&2
              exit 1
            fi
            curl -fsS "http://127.0.0.1:$AUDIT_PORT/api/v1/health" > /dev/null && break
            sleep 0.5
          done
          curl -fsS "http://127.0.0.1:$AUDIT_PORT/api/v1/health" > \
            "$RUNNER_TEMP/v1-linux-deep-health.json"
          "$BUNDLE/bin/acceptance-test.sh" --deep

      - name: Upload Linux Deep acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-deep-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/v1-acceptance-evidence
            ${{ runner.temp }}/v1-linux-deep-health.json
            ${{ runner.temp }}/java-audit-deep.log
