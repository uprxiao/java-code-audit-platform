spring:
  application:
    name: java-code-audit-platform
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

server:
  shutdown: graceful

audit:
  data-root: ${AUDIT_DATA_ROOT:./data}
  tools:
    semgrep-executable: ${AUDIT_SEMGREP_EXECUTABLE:./tools/downloads/bin/semgrep}
    semgrep-version: ${AUDIT_SEMGREP_VERSION:1.170.0}
    quick-root: ${AUDIT_QUICK_TOOL_ROOT:}
    standard-analysis-root: ${AUDIT_STANDARD_ANALYSIS_ROOT:${AUDIT_STANDARD_ANALYSIS_TOOL_ROOT:./tools/downloads/tool-pack/common/standard-analysis}}
    standard-supply-root: ${AUDIT_STANDARD_SUPPLY_ROOT:}
    vulnerability-data-root: ${AUDIT_VULNERABILITY_DATA_ROOT:${AUDIT_DATA_ROOT:./data}/databases}
    codeql-executable: ${AUDIT_CODEQL_EXECUTABLE:./tools/local/codeql-v2.26.2/codeql/codeql}
    codeql-query-suite: ${AUDIT_CODEQL_QUERY_SUITE:./tools/local/codeql-packs/codeql/java-queries/1.11.7/codeql-suites/java-security-and-quality.qls}
    codeql-enabled: ${AUDIT_CODEQL_ENABLED:false}
    codeql-terms-accepted: ${AUDIT_CODEQL_TERMS_ACCEPTED:false}
  maven:
    executable: ${AUDIT_MAVEN_EXECUTABLE:mvn}
    settings: ${AUDIT_MAVEN_SETTINGS:}
    max-heap-mb: ${AUDIT_MAVEN_MAX_HEAP_MB:3072}
    build-timeout: ${AUDIT_MAVEN_BUILD_TIMEOUT:20m}
  rules:
    semgrep: ${AUDIT_SEMGREP_RULES:./config/rules/semgrep/java-audit.yaml}
    gitleaks: ${AUDIT_GITLEAKS_RULES:./config/rules/gitleaks/gitleaks.toml}
    pmd: ${AUDIT_PMD_RULES:./config/rules/pmd/java-audit.xml}
    checkstyle: ${AUDIT_CHECKSTYLE_RULES:./config/rules/checkstyle/java-audit.xml}
    spotbugs-exclude: ${AUDIT_SPOTBUGS_EXCLUDE:./config/rules/spotbugs-exclude.xml}
  concurrency:
    max-queued-scan-jobs: ${AUDIT_MAX_QUEUED_SCAN_JOBS:20}
    max-concurrent-scan-jobs: ${AUDIT_MAX_CONCURRENT_SCAN_JOBS:2}
    max-concurrent-engines: ${AUDIT_MAX_CONCURRENT_ENGINES:4}
    max-engines-per-scan: ${AUDIT_MAX_ENGINES_PER_SCAN:2}
    weighted-permits: ${AUDIT_WEIGHTED_PERMITS:8}
    retry-after-seconds: ${AUDIT_QUEUE_RETRY_AFTER_SECONDS:30}
    tool-limits:
      maven: ${AUDIT_MAVEN_CONCURRENCY:1}
      dependency-check: ${AUDIT_DEPENDENCY_CHECK_CONCURRENCY:1}
      codeql: ${AUDIT_CODEQL_CONCURRENCY:1}
  intake:
    max-archive-bytes: ${AUDIT_MAX_ARCHIVE_BYTES:1073741824}
    max-expanded-bytes: ${AUDIT_MAX_EXPANDED_BYTES:10737418240}
    max-single-file-bytes: ${AUDIT_MAX_SINGLE_FILE_BYTES:1073741824}
    max-entries: ${AUDIT_MAX_ARCHIVE_ENTRIES:200000}
    max-compression-ratio: ${AUDIT_MAX_COMPRESSION_RATIO:100}
    svn:
      allowed-hosts: ${AUDIT_SVN_ALLOWED_HOSTS:}
      max-url-characters: ${AUDIT_SVN_MAX_URL_CHARACTERS:2048}
      max-expanded-bytes: ${AUDIT_SVN_MAX_EXPANDED_BYTES:10737418240}
      max-single-file-bytes: ${AUDIT_SVN_MAX_SINGLE_FILE_BYTES:1073741824}
      max-entries: ${AUDIT_SVN_MAX_ENTRIES:200000}
      max-path-characters: ${AUDIT_SVN_MAX_PATH_CHARACTERS:4096}
      connect-timeout: ${AUDIT_SVN_CONNECT_TIMEOUT:15s}
      read-timeout: ${AUDIT_SVN_READ_TIMEOUT:5m}
  storage:
    minimum-free-bytes: ${AUDIT_MINIMUM_FREE_BYTES:53687091200}
  retention:
    successful-results: ${AUDIT_SUCCESSFUL_RETENTION:30d}
    failed-results: ${AUDIT_FAILED_RETENTION:7d}
    failed-workspace: ${AUDIT_FAILED_WORKSPACE_RETENTION:24h}
    cleanup-interval: ${AUDIT_CLEANUP_INTERVAL:1h}
