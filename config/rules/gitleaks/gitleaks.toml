title = "Java Code Audit Platform Gitleaks policy"

# The default audit profile intentionally uses only Gitleaks' version-pinned,
# vendor-maintained detector set. A previous catch-all password/token regular
# expression also matched ordinary long identifiers and has been removed.
# Organization-specific token formats belong in a reviewed extension file with
# positive/negative fixtures, entropy where applicable, and narrow allowlists.
# The scanned repository's own .gitleaks.toml is never trusted implicitly.
[extend]
useDefault = true
