title = "Java Code Audit Platform Gitleaks policy"

# Retain Gitleaks' version-pinned built-in detector set. Project-specific
# allowlists can be layered later without trusting a scanned repository's
# .gitleaks.toml.
[extend]
useDefault = true

[[rules]]
id = "generic-audit-api-key"
description = "Generic API key or token assignment"
regex = '''(?i)(api[_-]?key|token|password)(\s*[=:]\s*["']?)([A-Za-z0-9_./+\-=]{20,})'''
secretGroup = 3
keywords = ["api_key", "api-key", "token", "password"]
tags = ["generic", "credential"]
