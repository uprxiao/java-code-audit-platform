name: java-code-audit-sonarqube

services:
  database:
    # mirror.gcr.io is Google's cache of the official Docker Hub library image.
    image: mirror.gcr.io/library/postgres:16.6-alpine@sha256:1d04b9ba1d4996401f2552b51beda8187f175c0645c091e4781134fc9c9a3eef
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sonarqube-internal
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped

  sonarqube:
    # Same manifest digest as the official Docker Hub library/sonarqube image.
    image: mirror.gcr.io/library/sonarqube:26.8.0.126808-community@sha256:6287ef13f5265d3eb26e6d5953ee08764d4ca73b3dabcd4e7de79ab040a6dfea
    depends_on:
      database:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://database:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?SONAR_DB_PASSWORD is required}
      SONAR_WEB_JAVAOPTS: -Xms256m -Xmx1g
      SONAR_CE_JAVAOPTS: -Xms256m -Xmx1g
      SONAR_SEARCH_JAVAOPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${SONAR_WEB_PORT:-19000}:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - sonarqube-internal
      - sonarqube-frontend
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped

networks:
  sonarqube-internal:
    internal: true
  sonarqube-frontend:

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
