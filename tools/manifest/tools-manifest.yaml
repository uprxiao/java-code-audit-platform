  fixtures:
    trivy-artifact: backend/scanner-adapters/src/test/resources/fixtures/trivy-artifact/0.73.0
  dataInvariant: A missing vulnerability database or unavailable online data source is a failed engine, never a clean zero-finding result.

notes:
  - Tool-pack binaries and Python runtime remain under gitignored tools/downloads until release assembly.
  - Installed wheel metadata retains Semgrep and transitive dependency license files.
  - Quick tool pack assembly verifies official archive SHA256 before extraction and emits per-tool stable pack-metadata.json.
  - Standard supply pack assembly verifies Dependency-Check and OSV official SHA256 values; CycloneDX is resolved by a pinned Maven coordinate and checked artifact hash.
  - Gitleaks and Trivy native entrypoint SHA256 values above were measured from both official platform archives.
  - Trivy 0.73.0 is pinned after the upstream March 2026 supply-chain incident; do not use latest tags or unverified setup actions.
  - PMD is BSD-style licensed; its official distribution LICENSE also carries required bundled dependency notices.
  - CodeQL is intentionally absent and is never redistributed by this public manifest.
